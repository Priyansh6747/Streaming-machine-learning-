site_name: "Major Project — Streaming ML"
site_description: "Research and experimentation on machine learning from data streams (concept drift, the Delay Tax)."
site_url: https://priyansh6747.github.io/Streaming-machine-learning-/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - toc:
      permalink: true

plugins:
  - search
  - exporter:
      formats:
        pdf:
          # PDFs are rendered at build time by a headless browser (playwright
          # chromium). Requires:  uv run playwright install chromium
          # Disable for a fast local build with:  MKDOCS_EXPORTER_PDF=false
          enabled: !ENV [MKDOCS_EXPORTER_PDF, true]
          concurrency: 4
          aggregator:
            # Optional extra: one big PDF of the whole site next to the
            # per-page PDFs. Needs MKDOCS_EXPORTER_PDF=true to make sense.
            enabled: !ENV [MKDOCS_EXPORTER_PDF_AGGREGATOR, false]
            output: documentation.pdf
      buttons:
        - title: Download as PDF
          icon: material/file-download-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

