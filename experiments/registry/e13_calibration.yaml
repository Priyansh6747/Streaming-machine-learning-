exp_id: e13
title: "Calibration under drift"
description: >
  ECE and Brier before and after drift for DriftFormer, ARF and HAT on binary
  generators. Probabilities are saved for offline reliability curves.
seeds: "0-10"
need_proba: true
stream_grid:
  generators: [sea, hyperplane]
  shapes: [abrupt, gradual]
  defaults:
    n_samples: 40000
    warm_up: 8000
    noise: 0.1
    position: 20000
    width: 2000
    concept_a: 0
    concept_b: 1
models:
  - id: driftformer
    type: driftformer
    params: {block_size: 32, d_model: 64, n_layers: 2, ssl_weight: 0.3, device: cpu}
  - id: arf
    type: river
    params: {class: ARFClassifier}
  - id: hat
    type: river
    params: {class: HoeffdingAdaptiveTreeClassifier}
detectors: []
detector_hosts: []
detector_channels: []
metrics:
  rolling_window: 1000
  band: 0.95
  stretch: 500
  window: 5000
acceptance: {}
