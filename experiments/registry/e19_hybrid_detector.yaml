exp_id: e19
title: "E19 — DF-H v1 rule-based fusion"
description: >
  Pre-registered DF-H v1 variants. Stage 1 is a label-free feature monitor:
  deep = max(SSL loss, embedding shift); classical = feature KS; both = the
  union of the two views. Stage 2 is the scalar panel SEED / STEPD / ADWIN /
  HDDM-A. The authoritative pilot is the KDD runner:
  ./experiments/kdd.sh run --datasets Covtype,Electricity --trials 5
  --signal correct --gradual-anchor code
  --detectors SEED,STEPD,ADWIN,HDDMAverage,HDDMWeighted
  --deep-signals experiments/data/deep_signals/pilot
  --out experiments/results/e19_kdd_pilot
  This registry config keeps the same pre-registration and extracts the Stage-1
  signals for the synthetic/E17 sanity checks.
seeds: "0-2"
need_proba: false
streams:
  - generator: sea
    shape: abrupt
    n_samples: 30000
    warm_up: 12000
    noise: 0.1
    position: 20000
    concept_a: 0
    concept_b: 1
  - generator: hyperplane
    shape: abrupt
    n_samples: 30000
    warm_up: 12000
    noise: 0.1
    position: 20000
    params: {n_features: 10}
  - generator: elec2
    shape: abrupt
    n_samples: 45312
    warm_up: 9062
    noise: 0.0
    position: 22656
    mechanism: label_swap
    params: {swap_from: 0, swap_to: 1}
  - generator: elec2
    shape: abrupt
    n_samples: 45312
    warm_up: 9062
    noise: 0.0
    position: 22656
    mechanism: feature_permutation
models:
  - id: ht
    type: river
    params: {class: HoeffdingTreeClassifier}
detectors: []
detector_hosts: []
detector_channels: []
metrics:
  rolling_window: 1000
  band: 0.95
  stretch: 500
  window: 5000
deep_signals:
  enabled: true
  baseline_model: ht
  window_size: 500
  stride: 100
  reference_fraction: 0.2
  mask_fraction: 0.15
  adwin_delta: 0.002
  ks_reference_size: 2000
  epochs: 1
  encoder:
    d_model: 64
    n_heads: 4
    n_layers: 2
    ffn: 128
    n_heads_bank: 4
    n_bins: 8
    dropout: 0.0
    block_size: 32
    batch_size: 128
    ring_size: 4096
    reservoir_size: 8192
    mask_fraction: 0.15
    device: cpu
hybrid:
  stage1_deep: [ssl_loss, embedding_shift]
  stage1_classical: [feature_ks]
  stage2: [SEED, STEPD, ADWIN, HDDMAverage]
  variants:
    - S1_deep
    - S1_classical
    - S1_both
    - OR_deep
    - AND_deep
    - 2of3_deep
    - 2of3_classical
    - 2of3_both
    - 2of3_nodeep
    - DFH
  far_per_1k: 0.1
  confirm_window: 2000
  refractory: 2000
  primary: DFH
acceptance: {}
