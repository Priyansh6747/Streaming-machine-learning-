site_name: "Major Project — Streaming ML"
site_description: "Research and experimentation on machine learning from data streams (concept drift, the Delay Tax)."
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - toc:
      permalink: true

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - "Phase 0 — Research":
      - Notes:
          - "Streaming learning": "Phase0:Research/notes/01-streaming-learning.md"
          - "Concept drift": "Phase0:Research/notes/02-concept-drift.md"
          - "The River library": "Phase0:Research/notes/03-river-library.md"
          - "Evaluation": "Phase0:Research/notes/04-evaluation.md"
          - "Project directions": "Phase0:Research/notes/05-project-directions.md"
          - "Literature & landscape": "Phase0:Research/notes/06-literature-landscape.md"
          - "Open questions": "Phase0:Research/notes/07-open-questions.md"
          - "Scope": "Phase0:Research/notes/08-scope.md"
      - Literature review:
          - "Index": "Phase0:Research/literature_review/index.md"
          - "Gap analysis": "Phase0:Research/literature_review/gap-analysis.md"
          - "Conclusion": "Phase0:Research/literature_review/Conclusion.md"
          - Papers:
              - "ROSE (Cano & Krawczyk 2022)": "Phase0:Research/literature_review/papers/cano-krawczyk-2022-rose.md"
              - "STUDD (Cerqueira 2023)": "Phase0:Research/literature_review/papers/cerqueira-2023-studd.md"
              - "Label delays (Botacin & Gomes 2024)": "Phase0:Research/literature_review/papers/botacin-gomes-2024-label-delays.md"
              - "DPL survey (Gomes 2022)": "Phase0:Research/literature_review/papers/gomes-2022-dpl-survey.md"
