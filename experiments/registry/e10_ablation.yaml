exp_id: e10
title: "DriftFormer ingredient ablations"
description: >
  Which mechanism earns the win: supervised scratch, SSL, the head bank, and
  drift-triggered head reset. Recurring and abrupt shapes, three generators.
seeds: [0, 1, 2, 3, 4]
need_proba: false
stream_grid:
  generators: [sea, hyperplane, agrawal]
  shapes: [recurring, abrupt]
  defaults:
    n_samples: 30000
    warm_up: 6000
    noise: 0.1
    position: 15000
    width: 2000
    period: 6000
    n_episodes: 2
    concept_a: 0
    concept_b: 1
models:
  - id: df_base
    type: driftformer
    params: {block_size: 32, d_model: 64, n_layers: 2, ssl_weight: 0.0, n_heads_bank: 4, reset_on_alarm: true, device: cpu}
  - id: df_ssl
    type: driftformer
    params: {block_size: 32, d_model: 64, n_layers: 2, ssl_weight: 0.3, n_heads_bank: 4, reset_on_alarm: true, device: cpu}
  - id: df_bank1
    type: driftformer
    params: {block_size: 32, d_model: 64, n_layers: 2, ssl_weight: 0.3, n_heads_bank: 1, reset_on_alarm: true, device: cpu}
  - id: df_no_reset
    type: driftformer
    params: {block_size: 32, d_model: 64, n_layers: 2, ssl_weight: 0.3, n_heads_bank: 4, reset_on_alarm: false, device: cpu}
detectors: []
detector_hosts: []
detector_channels: []
metrics:
  rolling_window: 1000
  band: 0.95
  stretch: 500
  window: 5000
acceptance: {}
