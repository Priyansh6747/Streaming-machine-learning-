name: ci
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/ci.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-exporter
      # PDF export renders each page in a headless browser at build time.
      - run: playwright install chromium --with-deps
      # Export PDFs (per-page + aggregated documentation.pdf) when deploying.
      - run: mkdocs gh-deploy --force
        env:
          MKDOCS_EXPORTER_PDF: "true"
          MKDOCS_EXPORTER_PDF_AGGREGATOR: "true"
