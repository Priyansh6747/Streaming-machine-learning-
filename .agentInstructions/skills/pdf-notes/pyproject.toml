[project]
name = "pdf-skill"
version = "0.1.0"
description = "PDF notes generation skill for OpenClaw agents — produces polished, study-ready PDFs from notes-as-code"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "reportlab>=4.0",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "pdf2image>=1.17",
    "matplotlib>=3.8",
    "pydantic>=2.0",
    "pygments>=2.18",
    "graphviz>=0.20",
    "numpy>=1.26",
    "pillow>=10.0",
    "black>=24.0",
]

[project.scripts]
pdf-skill = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
